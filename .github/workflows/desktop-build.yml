name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifacts: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS-Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifacts: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build desktop installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: gre-vocabulary-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
